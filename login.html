<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OPENIGHT Admin — Login</title><style>:root{--line:#ffffff18;--red:#ff3159;--orange:#ff8b1f}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 10%,#6d142b33,transparent 30%),radial-gradient(circle at 90% 90%,#ff810025,transparent 25%),#060608;color:#fff;font-family:Inter,Arial}.box{width:min(100%,980px);display:grid;grid-template-columns:1fr;gap:12px}.visual,.card{border:1px solid var(--line);border-radius:28px;background:#0e0f13}.visual{min-height:300px;padding:28px;display:flex;align-items:flex-end}.visual h1{font-size:56px;line-height:.83;letter-spacing:-4px;margin:8px 0}.ey{font-size:10px;letter-spacing:2px;color:#ff607d;font-weight:900}.visual p,.card p{color:#999;line-height:1.5}.card{padding:25px}.card h2{font-size:37px;margin:7px 0}.card label{display:block;color:#aaa;font-size:10px;margin:10px 0 5px}.card input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#07080b;color:#fff}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(90deg,var(--red),var(--orange));color:#fff;font-weight:950;margin-top:15px}.status{font-size:12px;color:#ff8aa0;margin-top:10px}@media(min-width:760px){.box{grid-template-columns:1.15fr .85fr}.visual{min-height:620px;padding:42px}.visual h1{font-size:80px}.card{display:flex;flex-direction:column;justify-content:center;padding:38px}}</style></head><body><div class="box"><section class="visual"><div><div class="ey">OPENIGHT CONTROL CENTER</div><h1>ROMA HITS<br>DIFFERENT.</h1><p>Gestisci calendario, eventi, prenotazioni, Amazônia, contenuti e tavoli.</p></div></section><section class="card"><div class="ey">AREA RISERVATA</div><h2>Admin Login</h2><p>Accedi con le credenziali configurate nel backend.</p><form id="f"><label>Email</label><input name="email" type="email" value="info.openight@gmail.com" required><label>Password</label><input name="password" type="password" required><button class="btn">Accedi</button><div id="status" class="status"></div></form></section></div><script src="./config.js"></script><script>const API=window.OPENIGHT_CONFIG.API_URL;f.onsubmit=async e=>{e.preventDefault();if(API.startsWith('PASTE_')){status.textContent='Collega prima Apps Script in config.js';return}const d=Object.fromEntries(new FormData(f).entries());d.action='adminLogin';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)});const j=await r.json();if(!j.ok)throw new Error(j.message||'Accesso negato');localStorage.setItem('openightAdminToken',j.token);location.href='./admin.html'}catch(err){status.textContent=err.message}}</script></body></html>
